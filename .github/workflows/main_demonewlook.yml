name: Build and deploy Node.js app to Azure Web App - DemoNewLook

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '~20'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist  # ✅ This is correct for Vite

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: node-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B4990DAF13B849A6847DAF042FF59069 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3D170FD2B54E4835BB96122F969DFEDD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_84A50AEBF0D44449BD89A94CD7E26DC5 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'DemoNewLook'
          slot-name: 'Production'
          package: node-app  # ✅ matches the download path
